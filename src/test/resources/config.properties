# Базові налаштування прогону.
# Будь-яке значення можна перекрити з командного рядка:  mvn test -Dheadless=true

base.url=https://www.youtube.com/
browser=chrome
headless=false

# Явні очікування, секунди
timeout.seconds=20
# Коротке очікування для необов'язкових елементів (банер згоди тощо)
timeout.short.seconds=5

# Мова інтерфейсу. Тест перевіряє українські написи "Підписатися" і "Увійти",
# тому UI має бути українською.
language=uk-UA

# Стартовий розмір вікна. Навмисно НЕ на весь екран:
# крок "зробити браузер на весь екран" має бути видимою дією, а не збігом.
# Має бути МЕНШИМ за робочу область екрана в обох вимірах, інакше крок 4
# (перевірка, що вікно побільшало) не може пройти фізично.
window.width=900
window.height=600
