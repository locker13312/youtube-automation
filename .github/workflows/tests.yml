name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # нічний прогін у будні, 03:00 UTC
    - cron: '0 3 * * 1-5'

jobs:
  unit:
    name: Перевірка тестових даних
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: RandomQueryTest
        run: mvn -B test -DsuiteFile=testng-unit.xml

  ui:
    name: UI-сценарій YouTube
    runs-on: ubuntu-latest
    needs: unit
    # Сценарій ходить у зовнішній продакшн-сайт: падіння можливе через капчу,
    # мовну версію інтерфейсу чи зміну верстки на боці Google, а не через дефект
    # у коді. Тому на push і PR він не запускається — тільки вручну і нічним
    # cron'ом. Там результат чесний: червоний означає «розберись за звітом».
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Прогін під Xvfb (headless YouTube частіше показує капчу)
        run: xvfb-run --auto-servernum mvn -B clean test -Dheadless=false

      - name: Зберегти результати Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      - name: Зберегти скріншоти падінь
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Звіт TestNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-report
          path: |
            target/surefire-reports
            test-output
          retention-days: 14
